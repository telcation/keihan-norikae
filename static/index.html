<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

* { box-sizing: border-box; }

.na-root {
  --bg: #EEF1EE;
  --ink: #1B2130;
  --muted: #6B7386;
  --navy: #121A2B;
  --navy-2: #1B2740;
  --amber: #F2A93B;
  --amber-deep: #C9821B;
  --teal: #3FBFAE;
  --line: #D8DCE0;
  --white: #F7F6F2;
  font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  color: var(--ink);
  background: var(--bg);
  padding: 20px 14px 60px;
  min-height: 100%;
  line-height: 1.5;
}
.na-wrap { max-width: 720px; margin: 0 auto; }
.na-mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

.na-board {
  background: var(--navy);
  background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  color: var(--white);
  border-radius: 14px;
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}
.na-board::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 85% -10%, rgba(242,169,59,0.18), transparent 55%);
  pointer-events: none;
}
.na-eyebrow { font-size: 11px; letter-spacing: 0.14em; color: var(--amber); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
.na-route { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.na-route .st { font-size: 22px; font-weight: 700; }
.na-route .arrow { color: var(--amber); font-size: 18px; }
.na-deadline { margin-top: 10px; font-size: 13px; color: #B9C0D0; }
.na-deadline b { color: var(--amber); font-family: 'JetBrains Mono', monospace; font-size: 15px; }
.na-timetable-date { margin-top: 4px; font-size: 11px; color: #7C8497; }
.na-gear {
  position: absolute; top: 14px; right: 14px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: var(--white); border-radius: 8px; padding: 7px 12px; font-size: 12px;
  cursor: pointer; font-family: inherit;
}
.na-gear:hover { background: rgba(255,255,255,0.16); }

.na-stale-warning {
  margin-top: 14px; background: #FFF3E0; border: 1px solid #F0B65E; color: #7A4A08;
  border-radius: 10px; padding: 10px 14px; font-size: 12.5px; line-height: 1.6;
}
.na-empty { color: #B23B2E; font-size: 14px; margin-top: 16px; }
.na-none { font-size: 13.5px; color: var(--muted); padding: 6px 2px; }

.na-section-title {
  margin: 26px 0 10px; font-size: 13px; font-weight: 700; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.na-section-title .no { background: var(--ink); color: var(--white); width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
.na-section-note { font-size: 12px; color: var(--muted); margin: -4px 0 12px; line-height: 1.6; }

.na-card {
  background: var(--white); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 10px;
}
.na-card.na-baseline { border-color: var(--amber); background: #FFF8EC; }
.na-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.na-time-big { font-size: 22px; font-weight: 700; }
.na-type-tag { font-size: 11px; background: var(--navy); color: var(--white); padding: 3px 8px; border-radius: 6px; font-weight: 500; }

.na-tt-vertical { margin-top: 10px; border-collapse: collapse; font-size: 13px; }
.na-tt-vertical th, .na-tt-vertical td { padding: 5px 10px; text-align: left; border-bottom: 1px solid var(--line); }
.na-tt-vertical th { color: var(--muted); font-weight: 500; width: 90px; }
.na-tt-vertical td { font-family: 'JetBrains Mono', monospace; }
.na-tt-vertical td.na-transfer-hit { background: #E8FBF6; color: #06322D; font-weight: 700; border-radius: 4px; }

.na-tt-scroll { overflow-x: auto; margin-top: 10px; }
.na-tt-feeders { border-collapse: collapse; font-size: 12.5px; white-space: nowrap; width: 100%; }
.na-tt-feeders th, .na-tt-feeders td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); }
.na-tt-feeders th { color: var(--muted); font-weight: 500; background: var(--white); position: sticky; top: 0; }
.na-tt-feeders td { font-family: 'JetBrains Mono', monospace; background: var(--white); }
.na-tt-feeders td:first-child, .na-tt-feeders th:first-child { font-family: inherit; }
.na-tt-feeders td.na-transfer-hit { background: #E8FBF6; color: #06322D; font-weight: 700; }
.na-wait { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 500; font-size: 10.5px; color: var(--teal); margin-left: 2px; }

.na-drawer { display: none; margin-top: 16px; }
.na-drawer.open { display: block; }
.na-btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.na-btn-row-top { margin-top: 0; margin-bottom: 16px; }
.na-panel { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.na-panel h3 { margin: 0 0 12px; font-size: 14px; }
.na-field { margin-bottom: 10px; }
.na-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.na-field input, .na-field select {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
  font-family: inherit; font-size: 14px; background: var(--bg);
}
.na-field input:focus, .na-field select:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
.na-fixed-route { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-weight: 700; background: var(--bg); color: var(--muted); }
.na-fixed-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.6; }

.na-btn { font-family: inherit; border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
.na-btn.primary { background: var(--navy); color: var(--white); }
.na-btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.na-btn:disabled { opacity: 0.5; cursor: default; }
.na-save-msg { font-size: 12px; color: var(--teal); margin-left: 4px; }
</style>

<div class="na-root">
  <div class="na-wrap">

    <div class="na-board">
      <button class="na-gear" id="gearBtn">⚙ 設定</button>
      <div class="na-eyebrow">乗換案内</div>
      <div class="na-route">
        <span class="st" id="hdBoard">香里園</span>
        <span class="arrow">→</span>
        <span class="st" id="hdAlight">渡辺橋</span>
      </div>
      <div class="na-deadline">到着期限　<b class="na-mono" id="hdDeadline">09:30</b></div>
      <div class="na-timetable-date" id="hdTimetableDate"></div>
    </div>

    <div class="na-stale-warning" id="staleWarning" style="display:none;"></div>

    <div id="detailBox"></div>

    <div class="na-drawer" id="drawer">
      <div class="na-btn-row na-btn-row-top">
        <button class="na-btn primary" id="saveBtn">検索条件を保存</button>
        <button class="na-btn ghost" id="resetBtn">デフォルトに戻す</button>
        <span class="na-save-msg" id="saveMsg"></span>
      </div>

      <div class="na-panel">
        <h3>基本設定</h3>
        <div class="na-field">
          <label>乗車駅（固定）</label>
          <div class="na-fixed-route">香里園</div>
        </div>
        <div class="na-field">
          <label>降車駅</label>
          <select id="inAlight"></select>
        </div>
        <div class="na-field">
          <label>到着期限（この時刻までに降車駅へ）</label>
          <input id="inDeadline" type="time">
        </div>
      </div>

      <div class="na-panel">
        <h3>時刻表データの更新</h3>
        <p class="na-fixed-note" style="margin-top:0;">
          <a href="https://www.keihan.co.jp/traffic/time-fare/time.html" target="_blank" rel="noopener">京阪公式サイト</a>から
          「京阪本線・中之島線・鴨東線 出町柳→淀屋橋・中之島方面行き（下り）」の全列車時刻表PDFをダウンロードし、
          ここにアップロードすると、サーバー側で自動的に解析・再計算されます（渡辺橋・淀屋橋の両方に対応するデータが更新されます）。
        </p>
        <div class="na-field">
          <input type="file" id="pdfFile" accept="application/pdf">
        </div>
        <div class="na-btn-row" style="margin-top:0;">
          <button class="na-btn primary" id="uploadBtn">アップロードして更新</button>
        </div>
        <div id="uploadStatus" class="na-fixed-note" style="margin-top:10px;"></div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const DEFAULT_SETTINGS = { board: "香里園", alight: "渡辺橋", deadline: "09:30" };
  const FULL_STATIONS = ["香里園", "寝屋川市", "萱島", "守口市", "京橋", "渡辺橋", "淀屋橋"];
  const TRANSFER_STATIONS = ["香里園", "寝屋川市", "萱島", "守口市", "京橋"];
  // 降車駅の選択肢は固定（バックエンドのDESTINATIONSと一致させる）。
  // API応答に依存すると、初回読み込み時にデータ未アップロード/エラーだった場合に
  // プルダウンが永久に空のままになってしまうため、ページ読み込み時に確定させる。
  const ALIGHT_OPTIONS = ["渡辺橋", "淀屋橋"];

  let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  let timetableDate = null;

  const $ = (id) => document.getElementById(id);

  function loadPrefs(){
    try{
      const raw = localStorage.getItem('norikae_settings');
      if(raw) settings = Object.assign(settings, JSON.parse(raw));
    }catch(e){ /* localStorage未対応環境では既定値のまま */ }
  }
  function savePrefs(){
    try{ localStorage.setItem('norikae_settings', JSON.stringify(settings)); }catch(e){}
  }

  function orderedStops(stops){
    return FULL_STATIONS.filter(st => st in stops).map(st => ({station: st, time: stops[st]}));
  }

  function timetableTable(stops, highlightStations){
    const list = orderedStops(stops);
    const hl = highlightStations || new Set();
    const rows = list.map(s => `<tr>
        <th>${s.station}</th>
        <td class="na-mono${hl.has(s.station)?' na-transfer-hit':''}">${s.time}</td>
      </tr>`).join('');
    return `<table class="na-tt-vertical">${rows}</table>`;
  }

  async function fetchRoute(){
    const url = `api/route?target=${encodeURIComponent(settings.alight)}&deadline=${encodeURIComponent(settings.deadline)}`;
    const res = await fetch(url);
    if(res.status === 404){
      return {noData: true};
    }
    if(!res.ok){
      throw new Error('HTTP ' + res.status);
    }
    return await res.json();
  }

  function renderTimetableFreshness(){
    const warn = $('staleWarning');
    if(!timetableDate){
      $('hdTimetableDate').textContent = '時刻表データ：未アップロード';
      warn.style.display = 'none';
      return;
    }
    const eff = new Date(timetableDate + "T00:00:00");
    const now = new Date();
    const days = Math.floor((now - eff) / (1000*60*60*24));
    const effLabel = timetableDate.replace(/-/g,'/');
    $('hdTimetableDate').textContent = `時刻表データ：${effLabel} 改正ダイヤ基準`;
    if(days >= 120){
      warn.style.display = 'block';
      warn.innerHTML = `⚠ この時刻表データは ${effLabel} 改正のもの（${days}日経過）です。京阪電車はダイヤ改正で時刻が変わることがあります。実際に利用する前に<a href="https://www.keihan.co.jp/traffic/time-fare/time.html" target="_blank" rel="noopener">公式時刻表</a>で最新かご確認ください。`;
    } else {
      warn.style.display = 'none';
    }
  }

  async function render(){
    $('hdBoard').textContent = settings.board;
    $('hdAlight').textContent = settings.alight;
    $('hdDeadline').textContent = settings.deadline;

    const detail = $('detailBox');
    let data;
    try{
      data = await fetchRoute();
    }catch(e){
      detail.innerHTML = `<div class="na-empty">データの取得に失敗しました: ${e.message}</div>`;
      return;
    }

    if(data.noData){
      timetableDate = null;
      renderTimetableFreshness();
      detail.innerHTML = `<div class="na-none">時刻表データがまだアップロードされていません。「⚙ 設定」からPDFをアップロードしてください。</div>`;
      return;
    }

    timetableDate = data.revision_date;
    renderTimetableFreshness();

    if(data.error){
      detail.innerHTML = `<div class="na-empty">${data.error}</div>`;
      return;
    }

    const {baseline, feeders} = data;
    const finalTrain = baseline.final_train;
    const boardType = baseline.board_type;
    const finalType = finalTrain.type;
    const typesDiffer = boardType !== finalType;

    let html = '';
    html += `<div class="na-section-title"><span class="no">1</span>基準ルートの到着列車（${settings.alight}に${settings.deadline}までに到着）</div>`;
    html += `<div class="na-card na-baseline">
      <div class="na-row">
        <div>${settings.board} <span class="na-time-big na-mono">${baseline.depart}</span> 発 <span class="na-type-tag">${boardType}</span></div>
        <div>${typesDiffer ? `<span class="na-type-tag">${finalType}</span> ` : ''}${settings.alight} <span class="na-time-big na-mono">${baseline.arrive}</span> 着</div>
      </div>
      ${timetableTable(finalTrain.stops, null)}
    </div>`;

    html += `<div class="na-section-title"><span class="no">2</span>この列車に乗換可能な列車（${feeders.length}件・香里園以降の全時刻表）</div>`;
    html += `<div class="na-section-note">普通→普通の乗換は除外しています。乗換の待ち時間が15分未満の列車のみを候補にしています。香里園発が遅い順に並んでいます。緑色のセルが、到着列車へ乗り換え可能な駅・時刻です（かっこ内は待ち時間）。</div>`;
    if(feeders.length === 0){
      html += `<div class="na-none">乗換可能な列車は見つかりませんでした。</div>`;
    } else {
      const cols = TRANSFER_STATIONS.filter(st => feeders.some(f => st in f.stops));
      let rows = '';
      feeders.forEach(f => {
        const waitByStation = {};
        f.transfer_points.forEach(p => { waitByStation[p.station] = p.wait_min; });
        rows += `<tr>
          <td><span class="na-type-tag">${f.type}</span></td>
          ${cols.map(st => {
            const time = f.stops[st] || '';
            const wait = waitByStation[st];
            const waitLabel = (wait !== undefined) ? `<span class="na-wait">（${wait}分）</span>` : '';
            return `<td class="na-mono${wait !== undefined ? ' na-transfer-hit' : ''}">${time}${waitLabel}</td>`;
          }).join('')}
        </tr>`;
      });
      html += `<div class="na-tt-scroll"><table class="na-tt-feeders">
        <thead><tr><th>種別</th>${cols.map(st => `<th>${st}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    }

    detail.innerHTML = html;
  }

  $('gearBtn').addEventListener('click', () => {
    const drawer = $('drawer');
    const opening = !drawer.classList.contains('open');
    drawer.classList.toggle('open');
    if(opening){
      drawer.scrollIntoView({behavior:'smooth', block:'start'});
    }
  });

  $('saveBtn').addEventListener('click', async () => {
    settings.alight = $('inAlight').value || settings.alight;
    settings.deadline = $('inDeadline').value || DEFAULT_SETTINGS.deadline;
    savePrefs();
    const msg = $('saveMsg');
    msg.textContent = '検索中…';
    await render();
    msg.textContent = '更新しました';
    setTimeout(() => { msg.textContent = ''; }, 2000);
  });

  $('resetBtn').addEventListener('click', async () => {
    settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    $('inAlight').value = settings.alight;
    $('inDeadline').value = settings.deadline;
    savePrefs();
    await render();
  });

  $('uploadBtn').addEventListener('click', async () => {
    const fileInput = $('pdfFile');
    const status = $('uploadStatus');
    const file = fileInput.files[0];
    if(!file){
      status.textContent = 'ファイルを選択してください。';
      return;
    }
    status.textContent = 'アップロード中…（PDF解析には数十秒かかることがあります）';
    $('uploadBtn').disabled = true;
    try{
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('api/upload-pdf', { method: 'POST', body: form });
      const data = await res.json();
      if(!res.ok){
        throw new Error(data.detail || ('HTTP ' + res.status));
      }
      status.textContent = `更新しました（改正日: ${data.revision_date || '不明'} / 列車数: ${data.train_count}）`;
      await render();
    }catch(e){
      status.textContent = 'アップロードに失敗しました: ' + e.message;
    }finally{
      $('uploadBtn').disabled = false;
    }
  });

  (async function init(){
    loadPrefs();
    if(!ALIGHT_OPTIONS.includes(settings.alight)) settings.alight = DEFAULT_SETTINGS.alight;
    $('inAlight').innerHTML = ALIGHT_OPTIONS.map(a => `<option value="${a}">${a}</option>`).join('');
    $('inAlight').value = settings.alight;
    $('inDeadline').value = settings.deadline;
    await render();
  })();
})();
</script>
