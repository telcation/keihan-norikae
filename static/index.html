<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

* { box-sizing: border-box; }

.na-root {
  --bg: #EEF1EE;
  --ink: #1B2130;
  --muted: #6B7386;
  --navy: #121A2B;
  --navy-2: #1B2740;
  --amber: #F2A93B;
  --amber-deep: #C9821B;
  --teal: #3FBFAE;
  --line: #D8DCE0;
  --white: #F7F6F2;
  font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  color: var(--ink);
  background: var(--bg);
  padding: 20px 14px 60px;
  min-height: 100%;
  line-height: 1.5;
}

.na-wrap { max-width: 640px; margin: 0 auto; }

.na-mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

/* ---- header board ---- */
.na-board {
  background: var(--navy);
  background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  color: var(--white);
  border-radius: 14px;
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}
.na-board::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 85% -10%, rgba(242,169,59,0.18), transparent 55%);
  pointer-events: none;
}
.na-eyebrow {
  font-size: 11px; letter-spacing: 0.14em; color: var(--amber);
  font-weight: 700; text-transform: uppercase; margin-bottom: 6px;
}
.na-route {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
.na-route .st { font-size: 22px; font-weight: 700; }
.na-route .arrow { color: var(--amber); font-size: 18px; }
.na-deadline {
  margin-top: 10px; font-size: 13px; color: #B9C0D0;
}
.na-deadline b { color: var(--amber); font-family: 'JetBrains Mono', monospace; font-size: 15px; }
.na-timetable-date { margin-top: 4px; font-size: 11px; color: #7C8497; }
.na-stale-warning {
  margin-top: 14px; background: #FFF3E0; border: 1px solid #F0B65E; color: #7A4A08;
  border-radius: 10px; padding: 10px 14px; font-size: 12.5px; line-height: 1.6;
}
.na-gear {
  position: absolute; top: 14px; right: 14px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  color: var(--white); border-radius: 8px; padding: 7px 12px; font-size: 12px;
  cursor: pointer; font-family: inherit;
}
.na-gear:hover { background: rgba(255,255,255,0.16); }

/* ---- summary line ---- */
.na-summary {
  margin-top: 16px; font-size: 13px; color: var(--muted);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.na-summary b { color: var(--ink); font-family: 'JetBrains Mono', monospace; }
.na-chip { background: var(--navy); color: var(--white); padding: 3px 9px; border-radius: 999px; font-size: 12px; }
.na-empty { color: #B23B2E; font-size: 14px; }

/* ---- section cards ---- */
.na-section-title {
  margin: 26px 0 10px; font-size: 13px; font-weight: 700; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.na-section-title .no { background: var(--ink); color: var(--white); width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }

.na-card {
  background: var(--white); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 10px;
}
.na-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.na-time-big { font-size: 22px; font-weight: 700; }
.na-type-tag { font-size: 11px; background: var(--navy); color: var(--white); padding: 3px 8px; border-radius: 6px; font-weight: 500; }
.na-transfer-tag { font-size: 11px; background: var(--teal); color: #06322D; padding: 3px 8px; border-radius: 6px; font-weight: 700; }
.na-transfer-line { margin-top: 3px; }
.na-transfer-line:first-child { margin-top: 0; }
.na-direct-tag { font-size: 11px; color: var(--muted); }
.na-detail { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
.na-arrow-mini { color: var(--muted); margin: 0 4px; }

.na-none { font-size: 13.5px; color: var(--muted); padding: 6px 2px; }

.na-refpair { margin-bottom: 10px; }
.na-ref-card { margin-bottom: 10px; }
.na-ref-card:last-child { margin-bottom: 0; }
.na-ref-tag {
  font-size: 10.5px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px;
}
.na-ref-over { color: #B23B2E; }

/* ---- settings drawer ---- */
.na-drawer { display: none; margin-top: 16px; }
.na-drawer.open { display: block; }
.na-panel {
  background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  margin-bottom: 14px;
}
.na-panel h3 { margin: 0 0 12px; font-size: 14px; }
.na-field { margin-bottom: 10px; }
.na-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.na-field input, .na-field select {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
  font-family: inherit; font-size: 14px; background: var(--bg);
}
.na-field input:focus, .na-field select:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
.na-fixed-route {
  padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
  font-size: 14px; font-weight: 700; background: var(--bg); color: var(--muted);
}
.na-fixed-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.6; }

.na-btn {
  font-family: inherit; border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px;
  font-weight: 700; cursor: pointer;
}
.na-btn.primary { background: var(--navy); color: var(--white); }
.na-btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.na-btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.na-btn-row-top { margin-top: 0; margin-bottom: 16px; }

.na-save-msg { font-size: 12px; color: var(--teal); margin-left: 4px; }
</style>

<div class="na-root">
  <div class="na-wrap">

    <div class="na-board">
      <button class="na-gear" id="gearBtn">⚙ 設定</button>
      <div class="na-eyebrow">乗換案内</div>
      <div class="na-route">
        <span class="st" id="hdBoard">香里園</span>
        <span class="arrow">→</span>
        <span class="st" id="hdAlight">渡辺橋</span>
      </div>
      <div class="na-deadline">到着期限　<b class="na-mono" id="hdDeadline">09:30</b></div>
      <div class="na-timetable-date" id="hdTimetableDate"></div>
    </div>

    <div class="na-stale-warning" id="staleWarning" style="display:none;"></div>

    <div class="na-summary" id="summaryBox"></div>

    <div id="detailBox"></div>

    <div class="na-drawer" id="drawer">
      <div class="na-btn-row na-btn-row-top">
        <button class="na-btn primary" id="saveBtn">保存して再計算</button>
        <button class="na-btn ghost" id="resetBtn">デフォルトに戻す</button>
        <span class="na-save-msg" id="saveMsg"></span>
      </div>

      <div class="na-panel">
        <h3>基本設定</h3>
        <div class="na-field">
          <label>乗車駅（固定）</label>
          <div class="na-fixed-route">香里園</div>
        </div>
        <div class="na-field">
          <label>降車駅</label>
          <select id="inAlight"></select>
          <div class="na-fixed-note">香里園からの時刻表データを降車駅ごとに持っているため、この一覧にある駅のみ選べます。</div>
        </div>
        <div class="na-field">
          <label>到着期限（この時刻までに降車駅へ）</label>
          <input id="inDeadline" type="time">
        </div>
      </div>

      <div class="na-panel">
        <h3>時刻表データの更新</h3>
        <p class="na-fixed-note" style="margin-top:0;">
          <a href="https://www.keihan.co.jp/traffic/time-fare/time.html" target="_blank" rel="noopener">京阪公式サイト</a>から
          「京阪本線・中之島線・鴨東線 出町柳→淀屋橋・中之島方面行き（下り）」の全列車時刻表PDFをダウンロードし、
          ここにアップロードすると、サーバー側で自動的に解析・再計算されます（渡辺橋・淀屋橋の両方を同時に更新します）。
        </p>
        <div class="na-field">
          <input type="file" id="pdfFile" accept="application/pdf">
        </div>
        <div class="na-btn-row" style="margin-top:0;">
          <button class="na-btn primary" id="uploadBtn">アップロードして更新</button>
        </div>
        <div id="uploadStatus" class="na-fixed-note" style="margin-top:10px;"></div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const DEFAULT_SETTINGS = { board: "香里園", alight: "渡辺橋", deadline: "09:30" };
  let TIMETABLE_EFFECTIVE_DATE = null; // APIから取得（データ未取得時はnull）
  let TRAIN_DATASETS = {};           // { "渡辺橋": [...], "淀屋橋": [...] } をAPIから取得
  let ALIGHT_OPTIONS = [];

  let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  let trains = [];

  const $ = (id) => document.getElementById(id);

  function toMin(t){
    if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return null;
    const [h,m] = t.split(':').map(Number);
    return h*60+m;
  }

  const API_BASE = ''; // 同一オリジンで配信する前提。別オリジンならここにAPIのベースURLを設定する

  async function loadState(){
    try{
      const raw = localStorage.getItem('norikae_settings');
      if(raw) settings = Object.assign(settings, JSON.parse(raw));
    }catch(e){ /* localStorage未対応環境では既定値のまま */ }
    settings.board = DEFAULT_SETTINGS.board;

    const ok = await fetchDatasets();
    if(!ok) return;

    if(!ALIGHT_OPTIONS.includes(settings.alight)) settings.alight = DEFAULT_SETTINGS.alight;
    trains = TRAIN_DATASETS[settings.alight];
  }

  // サーバーから最新の時刻表データを取得する。データ未アップロード(404)ならfalseを返す
  async function fetchDatasets(){
    try{
      const res = await fetch(API_BASE + '/api/datasets');
      if(res.status === 404){
        return false;
      }
      if(!res.ok){
        throw new Error('HTTP ' + res.status);
      }
      const data = await res.json();
      TRAIN_DATASETS = data.datasets || {};
      ALIGHT_OPTIONS = Object.keys(TRAIN_DATASETS);
      TIMETABLE_EFFECTIVE_DATE = data.revision_date || null;
      return true;
    }catch(e){
      console.error('データ取得に失敗しました', e);
      return false;
    }
  }

  async function saveState(){
    try{
      localStorage.setItem('norikae_settings', JSON.stringify(settings));
    }catch(e){ /* 保存できない場合も画面表示は継続 */ }
  }

  // 降車駅を切り替えたときに、その駅用の時刻表データに入れ替える
  function switchAlight(newAlight){
    if(!ALIGHT_OPTIONS.includes(newAlight)) return;
    settings.alight = newAlight;
    trains = TRAIN_DATASETS[newAlight];
  }

  function compute(){
    const dl = toMin(settings.deadline);
    if(dl === null) return {error: "到着期限の形式が正しくありません"};
    const valid = trains
      .filter(t => toMin(t.arrive) !== null && toMin(t.arrive) <= dl)
      .sort((a,b) => (toMin(a.arrive)-toMin(b.arrive)) || (toMin(a.depart)-toMin(b.depart)));
    if(valid.length === 0) return {error: `${settings.deadline} までに ${settings.alight} へ到着できる列車が見つかりません`};

    const pattern1 = valid[valid.length-1];
    const p1depart = toMin(pattern1.depart);
    const p1arrive = toMin(pattern1.arrive);
    // パターン2：パターン1と同時刻以降に香里園を発つ候補をすべて列挙する。
    // 同じ発車時刻でも乗換駅が異なれば別候補として扱う（パターン1そのものだけを除外）。
    // どれを選ぶかは利用者が判断するため、ここでは優劣をつけず全件を返す。
    const later = valid.filter(t => t !== pattern1 && toMin(t.depart) >= p1depart)
      .sort((a,b) => toMin(a.depart)-toMin(b.depart));

    // 参考：パターン1の到着時刻の直前・直後の列車を1本ずつ（全列車の到着時刻ベースで、
    // 期限の内外を問わず探す）。同じ到着時刻の候補が複数ある場合は、その中で最も遅く
    // 香里園を発てる（＝最も効率のよい）ものを代表として採用する。
    const allTrains = trains.filter(t => toMin(t.arrive) !== null);
    function pickLatestDepart(cands){
      return cands.reduce((best,c) => toMin(c.depart) > toMin(best.depart) ? c : best);
    }
    const beforeArrives = allTrains.filter(t => toMin(t.arrive) < p1arrive).map(t => toMin(t.arrive));
    const before = beforeArrives.length
      ? pickLatestDepart(allTrains.filter(t => toMin(t.arrive) === Math.max(...beforeArrives)))
      : null;
    const afterArrives = allTrains.filter(t => toMin(t.arrive) > p1arrive).map(t => toMin(t.arrive));
    const after = afterArrives.length
      ? pickLatestDepart(allTrains.filter(t => toMin(t.arrive) === Math.min(...afterArrives)))
      : null;

    // パターン1と同じ到着時刻になる他の経路（出発時刻の制約なし・全列挙）。
    // 「同じ時刻に着けるなら、他にどんな乗り方があるか」を確認するための一覧。
    const sameArrival = valid.filter(t => t !== pattern1 && toMin(t.arrive) === p1arrive)
      .sort((a,b) => toMin(a.depart)-toMin(b.depart));

    return { pattern1, pattern2: later, before, after, sameArrival };
  }

  function trainDesc(t){
    if(!t.legs || t.legs.length === 0){
      return `<span class="na-direct-tag">直通</span>`;
    }
    return t.legs.map(l =>
      `<div class="na-transfer-line"><span class="na-transfer-tag">乗換</span> ${l.station}着${l.arrive} → ${l.type} ${l.station}発${l.depart}</div>`
    ).join('');
  }

  // 発車時の種別と、最終到着時（最後の乗換後）の種別が異なる場合は、それぞれの時刻の横に表示する。
  // 直通、または乗換後も同じ種別の場合は1つだけ表示する。
  function cardRow(t){
    const lastLeg = (t.legs && t.legs.length) ? t.legs[t.legs.length-1] : null;
    const arriveType = lastLeg ? lastLeg.type : null;
    const showBoth = arriveType && arriveType !== t.type;
    const departSide = `<span class="na-time-big na-mono">${t.depart}</span> 発 <span class="na-type-tag">${t.type}</span>`;
    const arriveSide = showBoth
      ? `<span class="na-type-tag">${arriveType}</span> <span class="na-time-big na-mono">${t.arrive}</span> 着`
      : `<span class="na-time-big na-mono">${t.arrive}</span> 着`;
    return `<div class="na-row">
        <div>${departSide}</div>
        <div>${arriveSide}</div>
      </div>`;
  }

  function render(){
    $('hdBoard').textContent = settings.board;
    $('hdAlight').textContent = settings.alight;
    $('hdDeadline').textContent = settings.deadline;

    const summary = $('summaryBox');
    const detail = $('detailBox');

    if(ALIGHT_OPTIONS.length === 0){
      summary.innerHTML = '';
      detail.innerHTML = `<div class="na-none">時刻表データがまだアップロードされていません。「⚙ 設定」からPDFをアップロードしてください。</div>`;
      return;
    }

    const result = compute();

    if(result.error){
      summary.innerHTML = `<span class="na-empty">${result.error}</span>`;
      detail.innerHTML = '';
      return;
    }

    const {pattern1, pattern2, before, after, sameArrival} = result;
    summary.innerHTML = '';

    let html = '';

    html += `<div class="na-section-title"><span class="no">1</span>基準ルート（${settings.alight}に${settings.deadline}までに到着する列車）</div>`;
    html += `<div class="na-card">
      ${cardRow(pattern1)}
      <div class="na-detail">${trainDesc(pattern1)}</div>
    </div>`;

    html += `<div class="na-section-title"><span class="no">・</span>基準ルートと同じ${pattern1.arrive}着になる他の経路（${sameArrival.length}件・出発時刻を問わず全列挙）</div>`;
    if(sameArrival.length === 0){
      html += `<div class="na-none">同じ到着時刻になる他の経路はありません。</div>`;
    } else {
      sameArrival.forEach(t => {
        html += `<div class="na-card">
          ${cardRow(t)}
          <div class="na-detail">${trainDesc(t)}</div>
        </div>`;
      });
    }

    html += `<div class="na-section-title"><span class="no">2</span>後発でも間に合う候補（${pattern1.depart}以降の${settings.board}発・乗換駅ごとに列挙）</div>`;
    if(pattern2.length === 0){
      html += `<div class="na-none">該当する候補はありません。パターン1が唯一の候補です。</div>`;
    } else {
      pattern2.forEach(t => {
        html += `<div class="na-card">
          ${cardRow(t)}
          <div class="na-detail">${trainDesc(t)}</div>
        </div>`;
      });
    }

    html += `<div class="na-section-title"><span class="no">・</span>参考：基準ルートの到着時刻の前後1本</div>`;
    html += `<div class="na-refpair">`;
    if(before){
      html += `<div class="na-card na-ref-card">
        <div class="na-ref-tag">1本前</div>
        ${cardRow(before)}
        <div class="na-detail">${trainDesc(before)}</div>
      </div>`;
    } else {
      html += `<div class="na-none">これより前の列車データがありません。</div>`;
    }
    if(after){
      html += `<div class="na-card na-ref-card">
        <div class="na-ref-tag na-ref-over">1本後（期限超過）</div>
        ${cardRow(after)}
        <div class="na-detail">${trainDesc(after)}</div>
      </div>`;
    } else {
      html += `<div class="na-none">これより後の列車データがありません。</div>`;
    }
    html += `</div>`;

    detail.innerHTML = html;
  }

  $('gearBtn').addEventListener('click', () => {
    const drawer = $('drawer');
    const opening = !drawer.classList.contains('open');
    drawer.classList.toggle('open');
    if(opening){
      // 設定パネルはページ下部に表示されるため、開いたら自動でスクロールして見えるようにする
      drawer.scrollIntoView({behavior:'smooth', block:'start'});
    }
  });

  $('saveBtn').addEventListener('click', async () => {
    settings.deadline = $('inDeadline').value || DEFAULT_SETTINGS.deadline;
    await saveState();
    render();
    const msg = $('saveMsg');
    msg.textContent = '保存しました';
    setTimeout(() => { msg.textContent = ''; }, 2000);
  });

  $('resetBtn').addEventListener('click', async () => {
    settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    if(!ALIGHT_OPTIONS.includes(settings.alight)) settings.alight = ALIGHT_OPTIONS[0];
    trains = TRAIN_DATASETS[settings.alight] || [];
    $('inAlight').value = settings.alight;
    $('inDeadline').value = settings.deadline;
    await saveState();
    render();
  });

  $('inAlight').addEventListener('change', async (e) => {
    switchAlight(e.target.value);
    await saveState();
    render();
  });

  $('uploadBtn').addEventListener('click', async () => {
    const fileInput = $('pdfFile');
    const status = $('uploadStatus');
    const file = fileInput.files[0];
    if(!file){
      status.textContent = 'ファイルを選択してください。';
      return;
    }
    status.textContent = 'アップロード中…（PDF解析には数十秒かかることがあります）';
    $('uploadBtn').disabled = true;
    try{
      const form = new FormData();
      form.append('file', file);
      const res = await fetch(API_BASE + '/api/upload-pdf', { method: 'POST', body: form });
      const data = await res.json();
      if(!res.ok){
        throw new Error(data.detail || ('HTTP ' + res.status));
      }
      const countsText = Object.entries(data.counts).map(([k,v]) => `${k}: ${v}件`).join(' / ');
      status.textContent = `更新しました（改正日: ${data.revision_date || '不明'} / ${countsText}）`;
      const ok = await fetchDatasets();
      if(ok){
        if(!ALIGHT_OPTIONS.includes(settings.alight)) settings.alight = ALIGHT_OPTIONS[0];
        trains = TRAIN_DATASETS[settings.alight] || [];
        $('inAlight').innerHTML = ALIGHT_OPTIONS.map(a => `<option value="${a}">${a}</option>`).join('');
        $('inAlight').value = settings.alight;
        renderTimetableFreshness();
        render();
      }
    }catch(e){
      status.textContent = 'アップロードに失敗しました: ' + e.message;
    }finally{
      $('uploadBtn').disabled = false;
    }
  });

  function renderTimetableFreshness(){
    const warn = $('staleWarning');
    if(!TIMETABLE_EFFECTIVE_DATE){
      $('hdTimetableDate').textContent = '時刻表データ：未アップロード';
      warn.style.display = 'none';
      return;
    }
    const eff = new Date(TIMETABLE_EFFECTIVE_DATE + "T00:00:00");
    const now = new Date();
    const days = Math.floor((now - eff) / (1000*60*60*24));
    const effLabel = TIMETABLE_EFFECTIVE_DATE.replace(/-/g,'/');
    $('hdTimetableDate').textContent = `時刻表データ：${effLabel} 改正ダイヤ基準`;
    if(days >= 120){
      warn.style.display = 'block';
      warn.innerHTML = `⚠ この時刻表データは ${effLabel} 改正のもの（${days}日経過）です。京阪電車はダイヤ改正で時刻が変わることがあります。実際に利用する前に<a href="https://www.keihan.co.jp/traffic/time-fare/time.html" target="_blank" rel="noopener">公式時刻表</a>で最新かご確認ください。`;
    } else {
      warn.style.display = 'none';
    }
  }

  (async function init(){
    await loadState();
    $('inAlight').innerHTML = ALIGHT_OPTIONS.map(a => `<option value="${a}">${a}</option>`).join('');
    $('inAlight').value = settings.alight;
    $('inDeadline').value = settings.deadline;
    renderTimetableFreshness();
    render();
  })();
})();
</script>
